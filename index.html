<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qbe | Professional Thumbnail Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main id="landingPage" class="hero-container">
        <h1>Qbe.</h1>
        <p>The premium GFX studio for the "qbe" community.</p>
        
        <div class="cta-area">
            <button onclick="showEditor()" class="btn-main">Get Started</button>
            <a href="https://discord.gg/documentary" class="btn-link">Join Community</a>
        </div>
    </main>

    <div id="editorPage" class="editor-container" style="display:none;">
        <div class="canvas-box">
            <canvas id="thumbCanvas" width="1280" height="720"></canvas>
        </div>
        <div class="toolbar">
            <input type="file" id="imageLoader" accept="image/*">
            <input type="text" id="textInput" placeholder="Thumbnail text...">
            <button onclick="addText()" class="btn-action">Add Text</button>
            <button onclick="downloadImage()" class="btn-action">Download</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
