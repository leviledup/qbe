<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qbe | Thumbnail Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="landingPage" class="screen">
        <h1 class="hero-text">Qbe.</h1>
        <p class="sub-text">Create GFXes of your favourite "qbe" styled game!</p>
        
        <button onclick="showEditor()" class="btn-primary">Get started →</button>
        <button class="btn-secondary">View community</button>
    </div>

    <div id="editorPage" class="screen" style="display:none;">
        <div class="controls">
            <input type="file" id="imageLoader" accept="image/*">
            <input type="text" id="textInput" placeholder="Thumbnail text...">
            <button onclick="addText()" class="btn-secondary">Apply</button>
            <button onclick="downloadImage()" class="btn-primary">Download</button>
        </div>
        <canvas id="thumbCanvas" width="1280" height="720"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
