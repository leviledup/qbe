<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qbe BETA | Make Minecraft GFX like never before</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Qbe</h1>
        <p>Minecraft GFX Studio</p>
    </header>

    <div id="landingPage" class="screen">
        <h2>Create Stunning Thumbnails and/or Profile Pictures</h2>
        <p>Fast, simple, and professional.</p>
        <button onclick="showEditor()" class="start-btn">Start Creating</button>
    </div>

    <div id="editorPage" class="screen" style="display:none;">
        <div class="controls">
            <input type="file" id="imageLoader" accept="image/*">
            <input type="text" id="textInput" placeholder="Enter text...">
            <button onclick="addText()">Add Text</button>
            <button onclick="downloadImage()" class="download-btn">Download</button>
        </div>
        <canvas id="thumbCanvas" width="1280" height="720"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
