<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="../style.css"></head>
<body>
    <div class="grid-bg"></div>
    <nav class="topbar">
        <a href="../index.html" class="logo-text" style="text-decoration:none; color:inherit;">qbe</a>
        <div class="staircase-menu" id="menuBtn"><span></span><span></span><span></span></div>
    </nav>

    <main style="text-align:center; padding: 20px;">
        <h2>Smart Crop Helper</h2>
        <input type="file" id="imageInput" accept="image/*">
        <div class="preview-wrapper">
            <img id="preview" style="width:100%; height:100%; object-fit:cover;">
            <div class="safe-zone-overlay">SAFE ZONE</div>
        </div>
    </main>

    <script src="../script.js"></script>
    <script>
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = (event) => { document.getElementById('preview').src = event.target.result; };
            reader.readAsDataURL(e.target.files[0]);
        });
    </script>
</body>
</html>
